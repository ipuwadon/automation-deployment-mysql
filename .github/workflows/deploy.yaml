name: MySQL Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.0

      - name: Verification
        run: echo "GitHub Actions Runner is working"

      - name: Deploy schema
        run: |
          echo "Deploying MySQL schema..."
          mysql -h %DB_HOST% -u %DB_USER% -p%DB_PASS% < scripts/schema.sql
        shell: cmd

      - name: Run migrations
        run: |
          echo "Running migrations..."
          mysql -h %DB_HOST% -u %DB_USER% -p%DB_PASS% < scripts/migrations.sql
        shell: cmd