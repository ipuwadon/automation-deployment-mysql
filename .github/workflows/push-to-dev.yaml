name: MySQL Deployment - DEV

on:
  pull_request:
    branches:
      - dev

jobs:
  deploy-dev:
    runs-on: self-hosted

    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
      DB_NAME: ${{ secrets.DB_NAME }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed files
        shell: powershell
        run: |
          git diff --name-only HEAD~1 HEAD > changed_files.txt
          Write-Host "=== Changed files ==="
          Get-Content changed_files.txt
          Write-Host "=== End ==="

      - name: Run backout driver scripts
        shell: cmd
        run: |
          findstr /I /C:"backout_script.sql" changed_files.txt > backout_driver.txt 2>nul || (
            echo "No backout driver scripts detected"
            exit /b 0
          )
          for /F "usebackq delims=" %%f in (backout_driver.txt) do (
            echo Running backout driver: %%f
            mysql -h %DB_HOST% -u %DB_USER% -p%DB_PASS% %DB_NAME% < "%%f"
          )

      - name: Run release driver scripts
        shell: cmd
        run: |
          findstr /I /C:"release_script.sql" changed_files.txt > release_driver.txt 2>nul || (
            echo "No release driver scripts detected"
            exit /b 0
          )
          for /F "usebackq delims=" %%f in (release_driver.txt) do (
            echo Running release driver: %%f
            mysql -h %DB_HOST% -u %DB_USER% -p%DB_PASS% %DB_NAME% < "%%f"
          )