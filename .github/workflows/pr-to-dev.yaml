name: MySQL Deployment - DEV

on:
  pull_request:
    branches:
      - main

jobs:
  deploy-dev:
    runs-on: self-hosted

    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
      DB_NAME: ${{ secrets.DB_NAME }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed files
        shell: powershell
        run: |
          $baseSha = "${{ github.event.pull_request.base.sha }}"
          $headSha = "${{ github.event.pull_request.head.sha }}"

          Write-Host "Base SHA: $baseSha"
          Write-Host "Head SHA: $headSha"

          $changed = git diff --name-only $baseSha $headSha
          $changed | Out-File -FilePath changed_files.txt -Encoding ASCII

          Write-Host "=== Changed files ==="
          Get-Content changed_files.txt
          Write-Host "=== End ==="

      - name: Run rollback scripts
        shell: cmd
        run: |
          findstr /R /C:"rollback/" changed_files.txt > rollback_files.txt 2>nul || (
            echo "No rollback scripts detected"
            exit /b 0
          )
          for /F "usebackq delims=" %%f in (rollback_files.txt) do (
            echo Running rollback: %%f
            mysql -h %DB_HOST% -u %DB_USER% -p%DB_PASS% %DB_NAME% < "%%f"
          )

      - name: Run release scripts
        shell: cmd
        run: |
          findstr /R /C:"tables/" changed_files.txt > release_files.txt 2>nul || (
            echo "No release scripts detected"
            exit /b 0
          )
          for /F "usebackq delims=" %%f in (release_files.txt) do (
            echo Running release: %%f
            mysql -h %DB_HOST% -u %DB_USER% -p%DB_PASS% %DB_NAME% < "%%f"
          )

      - name: Run test scripts
        shell: cmd
        run: |
          findstr /R /C:"test/" changed_files.txt > test_files.txt 2>nul || (
            echo "No test scripts detected"
            exit /b 0
          )
          for /F "usebackq delims=" %%f in (test_files.txt) do (
            echo Running test: %%f
            mysql -h %DB_HOST% -u %DB_USER% -p%DB_PASS% %DB_NAME% < "%%f"
          )