name: MySQL Deployment - DEV

on:
  pull_request:
    branches:
      - dev

jobs:
  deploy-dev:
    runs-on: self-hosted

    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
      DB_NAME: ${{ secrets.DB_USER }}   # schema name = user name

    steps:
      - uses: actions/checkout@v5

      - name: Detect changed files
        id: changes
        shell: powershell
        run: |
          git fetch origin $env:GITHUB_BASE_REF
          $changed = git diff --name-only origin/$env:GITHUB_BASE_REF $env:GITHUB_HEAD_REF
          # Save as UTF-8 without BOM so findstr can read it
          $changed | Out-File -FilePath changed_files.txt -Encoding ASCII
          Get-Content changed_files.txt

      - name: Run rollback scripts
        shell: cmd
        run: |
          findstr /C:"rollback" changed_files.txt > rollback_files.txt
          if %ERRORLEVEL% NEQ 0 (
            echo "No rollback scripts detected"
          ) else (
            for /F %%f in (rollback_files.txt) do (
              echo Running rollback %%f
              mysql -h %DB_HOST% -u %DB_USER% -p%DB_PASS% %DB_NAME% < %%f
            )
          )

      - name: Run release scripts
        shell: cmd
        run: |
          for /F %%f in ('findstr /R "tables.*\.sql" changed_files.txt') do mysql -h %DB_HOST% -u %DB_USER% -p%DB_PASS% %DB_NAME% < %%f
          for /F %%f in ('findstr /R "views.*\.sql" changed_files.txt') do mysql -h %DB_HOST% -u %DB_USER% -p%DB_PASS% %DB_NAME% < %%f
          for /F %%f in ('findstr /R "indexes.*\.sql" changed_files.txt') do mysql -h %DB_HOST% -u %DB_USER% -p%DB_PASS% %DB_NAME% < %%f
          for /F %%f in ('findstr /R "procedures.*\.sql" changed_files.txt') do mysql -h %DB_HOST% -u %DB_USER% -p%DB_PASS% %DB_NAME% < %%f
          for /F %%f in ('findstr /R "triggers.*\.sql" changed_files.txt') do mysql -h %DB_HOST% -u %DB_USER% -p%DB_PASS% %DB_NAME% < %%f
          for /F %%f in ('findstr /R "events.*\.sql" changed_files.txt') do mysql -h %DB_HOST% -u %DB_USER% -p%DB_PASS% %DB_NAME% < %%f

      - name: Run test scripts
        shell: cmd
        run: |
          for /F %%f in ('findstr /R "feature.*test.*\.sql" changed_files.txt') do (
            echo Running test %%f
            mysql -h %DB_HOST% -u %DB_USER% -p%DB_PASS% %DB_NAME% < %%f
          )