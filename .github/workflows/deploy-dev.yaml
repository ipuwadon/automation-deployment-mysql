name: MySQL Deployment - DEV

on:
  pull_request:
    branches:
      - dev

jobs:
  deploy-dev:
    runs-on: self-hosted

    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
      DB_NAME: ${{ secrets.DB_USER }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect and run changed scripts
        shell: powershell
        run: |
          # Get changed files
          $baseRef = $env:GITHUB_BASE_REF
          $headRef = $env:GITHUB_HEAD_REF
          
          Write-Host "Base branch: $baseRef"
          Write-Host "Head branch: $headRef"
          
          git fetch origin $baseRef
          $changed = git diff --name-only origin/$baseRef $headRef
          
          Write-Host "=== Changed files ==="
          $changed | ForEach-Object { Write-Host $_ }
          Write-Host "=== End ==="
          
          # Filter and run scripts
          $rollbackFiles = $changed | Where-Object { $_ -match "rollback/" }
          $releaseFiles = $changed | Where-Object { $_ -match "tables/" }
          $testFiles = $changed | Where-Object { $_ -match "test/" }
          
          Write-Host "Rollback files: $($rollbackFiles.Count)"
          Write-Host "Release files: $($releaseFiles.Count)"
          Write-Host "Test files: $($testFiles.Count)"
          
          # Run rollback scripts
          if ($rollbackFiles) {
            foreach ($file in $rollbackFiles) {
              Write-Host "Running rollback: $file"
              & mysql -h $env:DB_HOST -u $env:DB_USER -p$env:DB_PASS $env:DB_NAME < $file
            }
          } else {
            Write-Host "No rollback scripts detected"
          }
          
          # Run release scripts
          if ($releaseFiles) {
            foreach ($file in $releaseFiles) {
              Write-Host "Running release: $file"
              & mysql -h $env:DB_HOST -u $env:DB_USER -p$env:DB_PASS $env:DB_NAME < $file
            }
          } else {
            Write-Host "No release scripts detected"
          }
          
          # Run test scripts
          if ($testFiles) {
            foreach ($file in $testFiles) {
              Write-Host "Running test: $file"
              & mysql -h $env:DB_HOST -u $env:DB_USER -p$env:DB_PASS $env:DB_NAME < $file
            }
          } else {
            Write-Host "No test scripts detected"
          }